name: Football Alerts Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  football-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Football Alerts
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python football_alerts.py

      - name: Guardar resultados
        run: |
          git config user.name "Football Alerts Bot"
          git config user.email "football-alerts-bot@users.noreply.github.com"

          git add signals.json bot_state.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
            exit 0
          fi

          git commit -m "Actualizar apuestas y estadísticas"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main