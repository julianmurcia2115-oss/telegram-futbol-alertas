name: Football Alerts

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:

  football-alerts:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Football Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python football_alerts.py

      - name: Guardar datos
        if: always()
        run: |

          git config user.name "Football Alerts Bot"

          git config user.email "football-alerts-bot@users.noreply.github.com"

          git add signals.json bot_state.json

          if git diff --cached --quiet; then

            echo "ℹ️ No hay cambios"

          else

            git commit -m "Actualizar datos del bot"

            git push origin main

          fi