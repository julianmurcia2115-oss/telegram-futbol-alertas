name: Football Alerts Bot

on:
  workflow_dispatch:

  schedule:
    # Ejecuta el bot cada 5 minutos
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  football-alerts:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar bot
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python football_alerts.py

      - name: Guardar base de datos
        run: |
          git config user.name "Football Alerts Bot"
          git config user.email "football-alerts-bot@users.noreply.github.com"

          git add data/apuestas.json

          git diff --cached --quiet || git commit -m "Actualizar apuestas"

          git push