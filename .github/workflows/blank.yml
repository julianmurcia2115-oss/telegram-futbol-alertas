name: Football Alerts

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:

  football-alerts:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Football Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python football_alerts.py &
          BOT_PID=$!

          echo "🤖 Bot iniciado"
          echo "⏳ Esperando 240 segundos..."

          sleep 240

          kill $BOT_PID || true

      - name: Guardar datos
        run: |

          git config user.name "Football Alerts Bot"
          git config user.email "football-alerts-bot@users.noreply.github.com"

          git add signals.json bot_state.json

          if git diff --cached --quiet; then

            echo "ℹ️ No hay cambios para guardar"

            exit 0

          fi

          git commit -m "Actualizar apuestas y estadísticas"

          echo "🔄 Sincronizando con GitHub..."

          git pull --rebase origin main

          echo "⬆️ Subiendo datos..."

          git push origin HEAD:main

          echo "✅ Datos guardados correctamente"