name: Football Alerts

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  football-alerts:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # DEPENDENCIAS
      # ==========================================

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==========================================
      # EJECUTAR BOT
      # ==========================================

      - name: Ejecutar Football Alerts
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python football_alerts.py

      # ==========================================
      # GUARDAR SIGNALS.JSON
      # ==========================================

      - name: Guardar apuestas
        run: |

          git config user.name "Football Alerts Bot"

          git config user.email "football-alerts-bot@users.noreply.github.com"

          git add signals.json

          if git diff --cached --quiet; then
            echo "ℹ️ No hay cambios en signals.json"
          else
            git commit -m "Actualizar apuestas y estadísticas"
            git push origin HEAD:main
          fi